services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - sportshub
    volumes:
      - ./data:/app/data:ro

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sportshub
      POSTGRES_USER: sportshub
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sportshub_dev}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/init_extensions.sql:/docker-entrypoint-initdb.d/01_extensions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sportshub"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sportshub

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - sportshub

volumes:
  pgdata:
  redisdata:

networks:
  sportshub:
    driver: bridge
