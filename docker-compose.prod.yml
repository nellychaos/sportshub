# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
services:
  app:
    restart: unless-stopped
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn sportshub.main:app --host 0.0.0.0 --port 8000 --workers 4"
    deploy:
      resources:
        limits:
          cpus: "3.5"
          memory: 4G

  postgres:
    restart: unless-stopped
    ports: []  # Do not expose to host in production
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 3G

  redis:
    restart: unless-stopped
    ports: []  # Do not expose to host in production
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
